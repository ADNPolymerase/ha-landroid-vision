start_one_time_mowing:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: lawn_mower
    runtime:
      required: false
      default: 60
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: min
          mode: slider
    edge_cut:
      required: false
      default: false
      selector:
        boolean:
    zones:
      required: false
      example:
        - 1
        - 2
      selector:
        object:

set_rtk_map_id:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: lawn_mower
    map_id:
      required: true
      selector:
        text:
set_firmware_notes:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: lawn_mower
    version:
      selector:
        text:
    mower_notes:
      selector:
        text:
          multiline: true
    head_version:
      selector:
        text:
    head_notes:
      selector:
        text:
          multiline: true
